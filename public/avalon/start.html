<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Conectar Avalon</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#0d1725;border:1px solid #20334d;border-radius:18px;padding:26px;text-align:center}.muted{color:#8294ab}.err{color:#ff6075}</style></head><body><div class="card"><h2>Conectando à Avalon...</h2><p id="msg" class="muted">Preparando autorização segura OAuth/PKCE.</p></div><script type="module">try{const cfg=await fetch('/api/avalon-config').then(r=>r.json());if(!cfg.ready)throw Error('Credenciais Avalon ainda não recebidas.');const{OAuthMethod}=await import('https://esm.sh/@quadcode-tech/client-sdk-js');const oauth=new OAuthMethod({apiBaseUrl:cfg.apiBaseUrl,clientId:Number(cfg.clientId),redirectUri:cfg.redirectUri,scope:cfg.scope});const{url,codeVerifier}=await oauth.createAuthorizationUrl();const state=new URL(url).searchParams.get('state');sessionStorage.setItem('pkce_verifier',codeVerifier);if(state)sessionStorage.setItem('avalon_oauth_state',state);location.href=url}catch(e){msg.textContent=e.message||'Não foi possível iniciar a autorização.';msg.className='err';setTimeout(()=>location.href='/avalon.html',2500)}</script></body></html>
