<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Avalon</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#0d1725;border:1px solid #20334d;border-radius:18px;padding:26px;text-align:center}.logo{font-size:26px;font-weight:900}.logo b{color:#4bc9ff}.muted{color:#8294ab}.ok{color:#27e39a}.err{color:#ff6075}a{display:inline-block;margin-top:16px;color:#4bc9ff}</style></head><body><div class="card"><div class="logo">SIGNAL <b>PRO</b></div><h2 id="title">Conectando à Avalon...</h2><p id="msg" class="muted">Validando o retorno da autorização oficial.</p><a href="/app.html">Voltar ao Signal Pro</a></div><script>const p=new URLSearchParams(location.search),code=p.get('code'),error=p.get('error'),state=p.get('state'),expected=sessionStorage.getItem('avalon_oauth_state');if(error){title.textContent='Autorização não concluída';title.className='err';msg.textContent=p.get('error_description')||error}else if(!code){title.textContent='Retorno OAuth incompleto';title.className='err';msg.textContent='A Avalon não retornou um código de autorização.'}else if(expected&&state!==expected){title.textContent='Validação de segurança falhou';title.className='err';msg.textContent='O state retornado não corresponde à sessão que iniciou a conexão.'}else{sessionStorage.setItem('avalon_authorization_code',code);title.textContent='Avalon autorizada';title.className='ok';msg.textContent='Autorização recebida. A troca segura do código por tokens será ativada quando a Avalon fornecer as credenciais e o endpoint oficial de token.'}</script></body></html>
