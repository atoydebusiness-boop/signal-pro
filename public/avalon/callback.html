<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Avalon</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#0d1725;border:1px solid #20334d;border-radius:18px;padding:26px;text-align:center}.logo{font-size:26px;font-weight:900}.logo b{color:#4bc9ff}.muted{color:#8294ab}.ok{color:#27e39a}.err{color:#ff6075}a{display:inline-block;margin-top:16px;color:#4bc9ff}</style></head><body><div class="card"><div class="logo">SIGNAL <b>PRO</b></div><h2 id="title">Conectando à Avalon...</h2><p id="msg" class="muted">Validando a autorização oficial.</p><a href="/app.html">Voltar ao Signal Pro</a></div><script type="module">const q=x=>document.getElementById(x),p=new URLSearchParams(location.search),code=p.get('code'),error=p.get('error'),state=p.get('state'),expected=sessionStorage.getItem('avalon_oauth_state'),verifier=sessionStorage.getItem('pkce_verifier');function fail(t,m){q('title').textContent=t;q('title').className='err';q('msg').textContent=m}if(error)fail('Autorização não concluída',p.get('error_description')||error);else if(!code||!verifier)fail('Retorno OAuth incompleto','Código de autorização ou verificador PKCE ausente. Inicie a conexão novamente.');else if(expected&&state!==expected)fail('Validação de segurança falhou','O retorno não corresponde à sessão que iniciou a conexão.');else{try{const r=await fetch('/api/avalon-oauth-exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,codeVerifier:verifier})}),j=await r.json();if(!r.ok)throw Error(j.message||j.error||'Falha na autorização');sessionStorage.removeItem('pkce_verifier');sessionStorage.removeItem('avalon_oauth_state');sessionStorage.setItem('avalon_access_token',j.accessToken);q('title').textContent='Avalon conectada';q('title').className='ok';q('msg').textContent='Autorização concluída com sucesso. Você já pode voltar ao Signal Pro.'}catch(e){fail('Não foi possível conectar',e.message||'Falha na troca segura do código OAuth.')}};</script></body></html>
