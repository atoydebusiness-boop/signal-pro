<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Avalon</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#0d1725;border:1px solid #20334d;border-radius:18px;padding:26px;text-align:center}.muted{color:#8294ab}.ok{color:#27e39a}.err{color:#ff6075}a{display:inline-block;margin-top:16px;color:#4bc9ff}</style></head><body><div class="card"><h2 id="title">Conectando à Avalon...</h2><p id="msg" class="muted">Validando autorização e conexão oficial.</p><a href="/app.html">Voltar ao Signal Pro</a></div><script type="module">const title=document.getElementById('title'),msg=document.getElementById('msg');try{const p=new URLSearchParams(location.search),code=p.get('code'),error=p.get('error'),state=p.get('state'),expected=sessionStorage.getItem('avalon_oauth_state'),codeVerifier=sessionStorage.getItem('pkce_verifier');if(error)throw Error(p.get('error_description')||error);if(!code||!codeVerifier)throw Error('Retorno OAuth incompleto.');if(expected&&state!==expected)throw Error('A validação de segurança do OAuth falhou.');const r=await fetch('/api/avalon-oauth-exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,codeVerifier})}),j=await r.json();if(!r.ok||!j.accessToken)throw Error(j.message||j.error||'Falha ao obter acesso Avalon.');const cfg=await fetch('/api/avalon-config',{cache:'no-store'}).then(x=>x.json());const{ClientSdk,OAuthMethod}=await import('https://esm.sh/@quadcode-tech/client-sdk-js');const oauth=new OAuthMethod({apiBaseUrl:cfg.apiBaseUrl,clientId:Number(cfg.clientId),redirectUri:cfg.redirectUri,scope:cfg.scope,accessToken:j.accessToken});const sdk=await ClientSdk.create(cfg.wsUrl,Number(cfg.platformId||199),oauth,{host:cfg.tradeHost});const balances=await sdk.balances();const list=balances.getBalances()||[];sessionStorage.removeItem('pkce_verifier');sessionStorage.removeItem('avalon_oauth_state');sessionStorage.setItem('avalon_connected','1');title.textContent='Avalon conectada';title.className='ok';msg.textContent=`Conexão oficial concluída. ${list.length} saldo(s) detectado(s). Você já pode voltar ao Signal Pro.`;setTimeout(()=>sdk.shutdown?.(),1500)}catch(e){title.textContent='Não foi possível conectar';title.className='err';msg.textContent=e?.message||'Falha na integração Avalon.'}</script></body></html>
