<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Avalon</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(560px,calc(100% - 32px));background:#0d1725;border:1px solid #20334d;border-radius:18px;padding:28px;text-align:center}.muted{color:#8294ab;line-height:1.5}.ok{color:#27e39a}.err{color:#ff6075}a{display:inline-block;margin-top:16px;color:#4bc9ff}</style></head>
<body><main class="card"><h2 id="title">Conectando à Avalon...</h2><p id="msg" class="muted">Validando sua autorização oficial.</p><a href="/app.html#avalon">Voltar ao Signal Pro</a></main>
<script type="module">
const title=document.getElementById('title'),msg=document.getElementById('msg');
async function jsonResponse(url,options){const response=await fetch(url,options),text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{throw Error(`Servidor respondeu ${response.status} sem JSON válido.`)}if(!response.ok)throw Error(data.message||data.error||`Erro HTTP ${response.status}`);return data}
function fail(error){title.textContent='Não foi possível conectar';title.className='err';msg.textContent=error?.message||'Falha na integração Avalon.'}
try{
 const params=new URLSearchParams(location.search),code=params.get('code'),error=params.get('error'),state=params.get('state'),expected=sessionStorage.getItem('avalon_oauth_state'),codeVerifier=sessionStorage.getItem('pkce_verifier');
 if(error)throw Error(params.get('error_description')||error);if(!code||!codeVerifier)throw Error('Retorno OAuth incompleto. Inicie a conexão novamente.');if(expected&&state!==expected)throw Error('A validação de segurança do OAuth falhou.');
 const token=await jsonResponse('/api/avalon-oauth-exchange',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({code,codeVerifier})});if(!token.accessToken)throw Error('A Avalon não retornou um token de acesso.');
 let balances=0,details='Autorização oficial concluída.';
 try{const cfg=await jsonResponse('/api/avalon-config',{cache:'no-store'});const{ClientSdk,OAuthMethod}=await import('https://esm.sh/@quadcode-tech/client-sdk-js');const oauth=new OAuthMethod({apiBaseUrl:cfg.apiBaseUrl,clientId:Number(cfg.clientId),redirectUri:cfg.redirectUri,scope:cfg.scope,accessToken:token.accessToken});const sdk=await ClientSdk.create(cfg.wsUrl,Number(cfg.platformId||199),oauth,{host:cfg.tradeHost});const account=await sdk.balances();balances=account?.getBalances?.()?.length||0;details=`Autorização concluída. ${balances} saldo(s) detectado(s).`;await sdk.shutdown?.()}catch(connectionError){console.warn('Avalon saldo indisponível após OAuth:',connectionError);details='Autorização concluída. Os saldos serão carregados quando a sessão estiver disponível.'}
 sessionStorage.removeItem('pkce_verifier');sessionStorage.removeItem('avalon_oauth_state');sessionStorage.setItem('avalon_connected','1');title.textContent='Avalon conectada';title.className='ok';msg.textContent=details;setTimeout(()=>location.href='/app.html#avalon',1200);
}catch(error){sessionStorage.removeItem('pkce_verifier');sessionStorage.removeItem('avalon_oauth_state');fail(error)}
</script></body></html>
