<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Diagnóstico OTC</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:14px system-ui}.w{max-width:800px;margin:auto;padding:24px}.card{background:#0d1725;border:1px solid #20334d;border-radius:16px;padding:20px;margin:14px 0}.ok{color:#27e39a}.wait{color:#ffc857}code{color:#4bc9ff}</style></head><body><main class="w"><h1>SIGNAL PRO • OTC</h1><div class="card"><b id="status" class="wait">AGUARDANDO CANDLES OTC...</b><p>Esta tela é somente para validar dados em conta demo. Ela não envia ordens.</p></div><div class="card"><b>PARES DETECTADOS</b><div id="pairs">Nenhum ainda.</div></div><div class="card"><b>ÚLTIMO CANDLE</b><pre id="last">—</pre></div></main><script src="/otc-capture.js"></script><script>addEventListener('signalpro:otc-candle',e=>{status.textContent='OTC CONECTADO • '+e.detail.count+' candles';status.className='ok';pairs.textContent=SignalProOTC.pairs().join(', ')||'Nenhum ainda.';last.textContent=JSON.stringify(e.detail,null,2)});</script></body></html>
