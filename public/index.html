  <body>
    <div class="box">
      <div class="logo">SIGNAL <b>PRO</b></div>
      <div class="muted">Verificando seu acesso...</div>
    </div>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2.116.0";
      try {
        const cfg = await fetch("/api/auth-config").then((r) => {
            if (!r.ok) throw Error();
            return r.json();
          }),
          sb = createClient(cfg.url, cfg.key),
          {
            data: { session },
          } = await sb.auth.getSession();
        location.replace(session ? "/app.html" : "/login.html");
      } catch (e) {
        location.replace("/login.html");
      }
    </script>
