<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Assinar Plano Pro</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#0d1725;border:1px solid #20334d;border-radius:20px;padding:28px;text-align:center}.logo{font-size:27px;font-weight:900}.logo b{color:#4bc9ff}.price{font-size:42px;font-weight:950;margin:20px 0}.muted{color:#8da2b6}.btn{width:100%;border:1px solid #2ee3a5;background:linear-gradient(135deg,#138967,#16a477);color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;font-size:15px}.btn:disabled{opacity:.55}.msg{min-height:24px;margin-top:14px;color:#ffc857}a{color:#4bc9ff}</style></head><body><div class="card"><div class="logo">SIGNAL <b>PRO</b></div><h1>Plano Pro</h1><div class="price">R$ 59,90 <small style="font-size:14px">/mês</small></div><p class="muted">Assinatura recorrente processada pelo Mercado Pago. O acesso é liberado após a confirmação do pagamento.</p><button id="buy" class="btn">ASSINAR COM MERCADO PAGO</button><div id="msg" class="msg"></div><p><a href="/app.html">← Voltar ao Signal Pro</a></p></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const b=document.getElementById('buy'),m=document.getElementById('msg');let sb;try{const cfg=await fetch('/api/auth-config').then(r=>r.json());sb=createClient(cfg.url,cfg.key);const s=(await sb.auth.getSession()).data.session;if(!s){location.replace('/login.html');throw Error('login')}b.onclick=async()=>{b.disabled=true;m.textContent='Abrindo checkout seguro...';try{const r=await fetch('/api/checkout',{method:'POST',headers:{Authorization:`Bearer ${s.access_token}`}}),d=await r.json();if(!r.ok||!d.init_point)throw Error(d.error||'Não foi possível iniciar o pagamento.');location.href=d.init_point}catch(e){m.textContent=e.message;b.disabled=false}}}catch(e){if(e.message!=='login'){m.textContent='Não foi possível carregar sua conta.';b.disabled=true}}</script></body></html>
