<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111e"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="shortcut icon" href="/favicon.svg"><title>Signal Pro — Assinar Plano Pro</title><script src="https://sdk.mercadopago.com/js/v2"></script><style>:root{--bg:#08111e;--card:#0d1725;--line:#20334d;--tx:#edf5ff;--mu:#8da2b6;--c:#4bc9ff;--g:#20d99a;--y:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui;min-height:100vh;padding:35px 16px}.wrap{max-width:720px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}.logo{text-align:center;font-size:27px;font-weight:900}.logo b{color:var(--c)}h1,.price{text-align:center}.price{font-size:42px;font-weight:950;margin:12px 0}.muted{color:var(--mu);text-align:center}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px 0}.tab{border:1px solid #31506d;background:#102137;color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}.tab.active{border-color:var(--c);background:#12304a}.pane{display:none}.pane.active{display:block}.btn{width:100%;border:1px solid #2ee3a5;background:#159b73;color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;font-size:15px}.field,.mp-field{width:100%;height:46px;padding:12px;border-radius:10px;border:1px solid #31506d;background:#081421;color:#fff;margin-top:6px}.mp-field{padding:0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.checkout{border:1px solid #29415f;background:#091421;border-radius:16px;padding:18px}.checkout label{display:block;color:#a9bed1;font-size:12px;font-weight:700}.msg{min-height:24px;margin:14px 0;color:var(--y);text-align:center}.pixbox{text-align:center;padding:18px;border:1px solid #29415f;border-radius:14px;margin-top:15px}.pixbox img{max-width:260px;width:100%;background:#fff;padding:8px;border-radius:10px}.pixcode{width:100%;min-height:90px;background:#07111c;color:#cfeaff;border:1px solid #29415f;border-radius:10px;padding:10px;resize:none}.back{text-align:center;margin-top:18px}.back a{color:var(--c)}select.field{appearance:auto}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><div class="logo">SIGNAL <b>PRO</b></div><h1>Plano Pro</h1><div class="price">R$ 59,90 <small style="font-size:14px">/mês</small></div><p class="muted">Pagamento seguro processado pelo Mercado Pago.</p><div class="tabs"><button id="pixTab" class="tab active">PIX</button><button id="cardTab" class="tab">CARTÃO</button></div><div id="pixPane" class="pane active"><div class="checkout"><p style="margin-top:0"><b>Pagamento instantâneo via Pix</b></p><p class="muted" style="text-align:left">Gere o QR Code e pague pelo aplicativo do seu banco.</p><button id="pixBtn" class="btn">GERAR PIX • R$ 59,90</button><div id="cpfFallback" style="display:none;margin-top:10px"><p class="muted">O Mercado Pago solicitou CPF para concluir.</p><input id="cpf" class="field" inputmode="numeric" maxlength="14" placeholder="CPF do pagador"><button id="pixCpfBtn" class="btn" style="margin-top:10px">CONTINUAR</button></div><div id="pixResult"></div></div></div><div id="cardPane" class="pane"><form id="form-checkout" class="checkout"><div class="grid"><label class="full">Número do cartão<div id="form-checkout__cardNumber" class="mp-field"></div></label><label>Validade<div id="form-checkout__expirationDate" class="mp-field"></div></label><label>CVV<div id="form-checkout__securityCode" class="mp-field"></div></label><label class="full">Nome impresso no cartão<input id="form-checkout__cardholderName" class="field" type="text" autocomplete="cc-name"></label><label class="full">E-mail<input id="form-checkout__cardholderEmail" class="field" type="email"></label><label>Banco emissor<select id="form-checkout__issuer" class="field"></select></label><label>Parcelas<select id="form-checkout__installments" class="field"></select></label><label>Documento<select id="form-checkout__identificationType" class="field"></select></label><label>Número do documento<input id="form-checkout__identificationNumber" class="field" type="text"></label><button id="form-checkout__submit" class="btn full" type="submit">PAGAR R$ 59,90</button></div></form></div><div id="msg" class="msg">Carregando checkout seguro...</div><div class="back"><a href="/app.html">← Voltar ao Signal Pro</a></div></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const $=id=>document.getElementById(id),msg=$('msg');let session,mp,cardForm;function pane(w){$('pixTab').classList.toggle('active',w==='pix');$('cardTab').classList.toggle('active',w==='card');$('pixPane').classList.toggle('active',w==='pix');$('cardPane').classList.toggle('active',w==='card')}$('pixTab').onclick=()=>pane('pix');$('cardTab').onclick=()=>pane('card');async function pay(formData){const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({formData})}),d=await r.json();if(!r.ok){const e=new Error(d.error+(d.detail?' — '+d.detail:''));e.data=d;throw e}return d}function needsDocument(e){const s=JSON.stringify(e?.data||{}).toLowerCase();return s.includes('identification')||s.includes('document')||s.includes('cpf')}function showPix(d){$('pixResult').innerHTML=`<div class="pixbox"><b>PIX GERADO</b><p class="muted">Escaneie ou copie o código.</p>${d.qr_code_base64?`<img src="data:image/png;base64,${d.qr_code_base64}" alt="QR Code Pix">`:''}<textarea id="pixCode" class="pixcode" readonly>${d.qr_code||''}</textarea><button id="copyPix" class="btn">COPIAR PIX</button></div>`;$('copyPix').onclick=async()=>{await navigator.clipboard.writeText(d.qr_code||'');$('copyPix').textContent='PIX COPIADO ✓'};msg.textContent='Aguardando confirmação do pagamento.'}async function generatePix(cpf=''){msg.textContent='Gerando Pix...';$('pixBtn').disabled=true;try{const payer={email:session.user.email};if(cpf)payer.identification={type:'CPF',number:cpf};showPix(await pay({payment_method_id:'pix',payer}));$('cpfFallback').style.display='none'}catch(e){$('pixBtn').disabled=false;if(!cpf&&needsDocument(e)){$('cpfFallback').style.display='block';msg.textContent='O Mercado Pago exige CPF para este pagamento.'}else msg.textContent=e.message}}try{const cfg=await fetch('/api/auth-config').then(r=>r.json()),sb=createClient(cfg.url,cfg.key);session=(await sb.auth.getSession()).data.session;if(!session){location.replace('/login.html');throw Error('login')}const pc=await fetch('/api/payment-config').then(async r=>({ok:r.ok,data:await r.json()}));if(!pc.ok||!pc.data.publicKey)throw Error('Chave pública do Mercado Pago não encontrada no ambiente.');mp=new MercadoPago(pc.data.publicKey,{locale:'pt-BR'});msg.textContent='';$('pixBtn').onclick=()=>generatePix();$('pixCpfBtn').onclick=()=>{const cpf=$('cpf').value.replace(/\D/g,'');if(cpf.length!==11)return msg.textContent='Informe um CPF válido.';generatePix(cpf)};$('form-checkout__cardholderEmail').value=session.user.email;cardForm=mp.cardForm({amount:'59.90',iframe:true,form:{id:'form-checkout',cardNumber:{id:'form-checkout__cardNumber'},expirationDate:{id:'form-checkout__expirationDate'},securityCode:{id:'form-checkout__securityCode'},cardholderName:{id:'form-checkout__cardholderName'},issuer:{id:'form-checkout__issuer'},installments:{id:'form-checkout__installments'},identificationType:{id:'form-checkout__identificationType'},identificationNumber:{id:'form-checkout__identificationNumber'},cardholderEmail:{id:'form-checkout__cardholderEmail'}},callbacks:{onFormMounted:e=>{if(e)console.error(e)},onSubmit:async e=>{e.preventDefault();const b=$('form-checkout__submit');b.disabled=true;msg.textContent='Processando pagamento...';try{const d=cardForm.getCardFormData(),r=await pay({token:d.token,issuer_id:d.issuerId,payment_method_id:d.paymentMethodId,transaction_amount:Number(d.amount),installments:Number(d.installments),payer:{email:d.cardholderEmail,identification:{type:d.identificationType,number:d.identificationNumber}}});if(r.status==='approved'){msg.textContent='Pagamento aprovado! Atualizando seu acesso...';setTimeout(()=>location.href='/app.html?payment=approved',1600)}else{msg.textContent='Pagamento recebido. Status: '+(r.status||'em processamento');b.disabled=false}}catch(e){msg.textContent=e.message;b.disabled=false}},onFetching:()=>{}}})}catch(e){if(e.message!=='login')msg.textContent=e.message}</script></body></html>
