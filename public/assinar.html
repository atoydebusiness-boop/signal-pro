<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Assinar Plano Pro</title><script src="https://sdk.mercadopago.com/js/v2"></script><style>:root{--bg:#08111e;--card:#0d1725;--line:#20334d;--tx:#edf5ff;--mu:#8da2b6;--c:#4bc9ff;--g:#20d99a;--y:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui;min-height:100vh;padding:35px 16px}.wrap{max-width:720px;margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px}.logo{text-align:center;font-size:27px;font-weight:900}.logo b{color:var(--c)}h1,.price{text-align:center}.price{font-size:42px;font-weight:950;margin:12px 0}.muted{color:var(--mu);text-align:center}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:24px 0}.tab{border:1px solid #31506d;background:#102137;color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}.tab.active{border-color:var(--c);background:#12304a}.pane{display:none}.pane.active{display:block}.btn{width:100%;border:1px solid #2ee3a5;background:#159b73;color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;font-size:15px}.field{width:100%;padding:12px;border-radius:10px;border:1px solid #31506d;background:#081421;color:#fff;margin:8px 0}.msg{min-height:24px;margin:14px 0;color:var(--y);text-align:center}.pixbox{text-align:center;padding:18px;border:1px solid #29415f;border-radius:14px;margin-top:15px}.pixbox img{max-width:260px;width:100%;background:#fff;padding:8px;border-radius:10px}.pixcode{width:100%;min-height:90px;background:#07111c;color:#cfeaff;border:1px solid #29415f;border-radius:10px;padding:10px;resize:none}.back{text-align:center;margin-top:18px}.back a{color:var(--c)}</style></head><body><div class="wrap"><div class="card"><div class="logo">SIGNAL <b>PRO</b></div><h1>Plano Pro</h1><div class="price">R$ 59,90 <small style="font-size:14px">/mês</small></div><p class="muted">Escolha Pix ou cartão. O pagamento é processado com segurança pelo Mercado Pago.</p><div class="tabs"><button id="pixTab" class="tab active">PIX</button><button id="cardTab" class="tab">CARTÃO</button></div><div id="pixPane" class="pane active"><input id="cpf" class="field" inputmode="numeric" maxlength="14" placeholder="CPF do pagador"><button id="pixBtn" class="btn">GERAR PIX • R$ 59,90</button><div id="pixResult"></div></div><div id="cardPane" class="pane"><div id="paymentBrick_container"></div></div><div id="msg" class="msg">Carregando checkout seguro...</div><div class="back"><a href="/app.html">← Voltar ao Signal Pro</a></div></div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const $=id=>document.getElementById(id),msg=$('msg');let session,mp,brickController;function pane(which){$('pixTab').classList.toggle('active',which==='pix');$('cardTab').classList.toggle('active',which==='card');$('pixPane').classList.toggle('active',which==='pix');$('cardPane').classList.toggle('active',which==='card')}$('pixTab').onclick=()=>pane('pix');$('cardTab').onclick=()=>pane('card');async function pay(formData){const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({formData})}),d=await r.json();if(!r.ok)throw Error(d.error+(d.detail?' — '+d.detail:''));return d}try{const cfg=await fetch('/api/auth-config').then(r=>r.json()),sb=createClient(cfg.url,cfg.key);session=(await sb.auth.getSession()).data.session;if(!session){location.replace('/login.html');throw Error('login')}const pc=await fetch('/api/payment-config').then(async r=>({ok:r.ok,data:await r.json()}));if(!pc.ok||!pc.data.publicKey)throw Error('Chave pública do Mercado Pago não encontrada no ambiente.');mp=new MercadoPago(pc.data.publicKey,{locale:'pt-BR'});msg.textContent='';$('pixBtn').onclick=async()=>{const cpf=$('cpf').value.replace(/\D/g,'');if(cpf.length!==11){msg.textContent='Informe um CPF válido para gerar o Pix.';return}$('pixBtn').disabled=true;msg.textContent='Gerando Pix...';try{const d=await pay({payment_method_id:'pix',payer:{email:session.user.email,identification:{type:'CPF',number:cpf}}});const r=$('pixResult');r.innerHTML=`<div class="pixbox"><b>PIX GERADO</b><p class="muted">Pague pelo aplicativo do seu banco.</p>${d.qr_code_base64?`<img src="data:image/png;base64,${d.qr_code_base64}" alt="QR Code Pix">`:''}<textarea id="pixCode" class="pixcode" readonly>${d.qr_code||''}</textarea><button id="copyPix" class="btn">COPIAR PIX</button></div>`;document.getElementById('copyPix').onclick=async()=>{await navigator.clipboard.writeText(d.qr_code||'');document.getElementById('copyPix').textContent='PIX COPIADO ✓'};msg.textContent='Aguardando confirmação do pagamento.'}catch(e){msg.textContent=e.message;$('pixBtn').disabled=false}};const bricks=mp.bricks();brickController=await bricks.create('payment','paymentBrick_container',{initialization:{amount:59.90,payer:{email:session.user.email}},customization:{paymentMethods:{creditCard:'all',debitCard:'all',bankTransfer:[]}},callbacks:{onReady:()=>{},onSubmit:async({formData})=>{msg.textContent='Processando pagamento...';try{const d=await pay(formData);if(d.status==='approved'){msg.textContent='Pagamento aprovado! Seu acesso será atualizado após a confirmação.';setTimeout(()=>location.href='/app.html?payment=approved',1800)}else msg.textContent='Pagamento recebido. Status: '+(d.status||'em processamento') }catch(e){msg.textContent=e.message;throw e}},onError:e=>{console.error(e);msg.textContent='Não foi possível carregar/processar o cartão.'}}})}catch(e){if(e.message!=='login')msg.textContent=e.message}</script></body></html>
