<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Gerenciador</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf7ff;font:14px system-ui}.w{width:min(1150px,94vw);margin:30px auto}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:950}.logo b{color:#42c8ff}.btn{background:#102137;border:1px solid #29415f;color:white;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.card{background:#0d1827;border:1px solid #203650;border-radius:14px;padding:18px}.card small{color:#8294ab}.card b{display:block;font-size:26px;margin-top:5px}.table{overflow:auto;background:#0d1827;border:1px solid #203650;border-radius:14px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:13px;border-bottom:1px solid #1b3048}th{color:#8294ab}.ok{color:#35dfa0}.trial{color:#ffc857}.blocked{color:#ff6075}.gate{min-height:80vh;display:grid;place-items:center}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div id="gate" class="gate">Validando administrador...</div><main id="app" class="w" style="display:none"><div class="top"><div class="logo">SIGNAL <b>PRO</b> <span style="font-size:13px;color:#8294ab">GERENCIADOR</span></div><div><button class="btn" onclick="location.href='/app.html'">SINAIS</button> <button id="out" class="btn">SAIR</button></div></div><div class="cards"><div class="card"><small>USUÁRIOS</small><b id="total">0</b></div><div class="card"><small>ASSINANTES ATIVOS</small><b id="paid">0</b></div><div class="card"><small>EM TESTE</small><b id="trials">0</b></div><div class="card"><small>BLOQUEADOS</small><b id="blocks">0</b></div></div><h2>Usuários</h2><div class="table"><table><thead><tr><th>E-mail</th><th>Perfil</th><th>Plano</th><th>Análises</th><th>Assinatura</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/auth-config').then(r=>r.json()),sb=createClient(cfg.url,cfg.key),{data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html')}else{const{data:me,error}=await sb.from('profiles').select('role').eq('id',session.user.id).single();if(error||me?.role!=='admin'){location.replace('/app.html')}else{const{data:users,error:e}=await sb.from('profiles').select('email,role,status,plan,analyses_used,subscription_status,subscription_expires_at,created_at').order('created_at',{ascending:false});if(e){gate.textContent='Erro ao carregar usuários: '+e.message}else{gate.style.display='none';app.style.display='block';total.textContent=users.length;paid.textContent=users.filter(x=>x.subscription_status==='active').length;trials.textContent=users.filter(x=>x.plan==='trial').length;blocks.textContent=users.filter(x=>x.status==='blocked').length;rows.innerHTML=users.map(x=>`<tr><td>${x.email||'—'}</td><td>${x.role}</td><td class="${x.plan==='trial'?'trial':'ok'}">${x.plan}</td><td>${x.analyses_used}/10</td><td>${x.subscription_status}</td><td class="${x.status==='blocked'?'blocked':'ok'}">${x.status}</td></tr>`).join('')}}}out.onclick=async()=>{await sb.auth.signOut();location.href='/login.html'};</script></body></html>
