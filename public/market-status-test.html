<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Signal Pro — Mercado</title><style>body{background:#08111e;color:#edf5ff;font:15px system-ui;padding:30px}.card{max-width:700px;margin:auto;background:#0d1725;border:1px solid #20334d;border-radius:16px;padding:22px}.ok{color:#27e39a}.closed{color:#ffc857}</style></head><body><div class="card"><h2>STATUS DO FOREX</h2><h1 id="s">VERIFICANDO...</h1><p id="d"></p></div><script>fetch('/api/market',{cache:'no-store'}).then(async r=>({r,j:await r.json()})).then(({r,j})=>{if(r.ok&&j.marketOpen){s.textContent='● FOREX ONLINE';s.className='ok';d.textContent='Última vela: '+(j.latestCandleAt||'—')+' • '+j.source}else if(j.error==='FOREX_FECHADO'){s.textContent='● FOREX FECHADO';s.className='closed';d.textContent='Sem vela M1 nova. Nenhum sinal Forex deve ser gerado.'}else{s.textContent='● FONTE INDISPONÍVEL';d.textContent=j.message||j.error||'Erro'}}).catch(()=>{s.textContent='● ERRO DE CONEXÃO'});</script></body></html>
