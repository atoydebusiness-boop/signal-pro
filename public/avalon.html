<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Conectar Avalon</title><style>body{margin:0;background:#07111f;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#0b192a;border:1px solid #203a58;border-radius:20px;padding:30px;text-align:center}.logo{font-size:28px;font-weight:900;margin-bottom:8px}.logo b{color:#45c8ff}.muted{color:#8fa5bd;line-height:1.5;margin:0 0 24px}.btn{width:100%;border:1px solid #2ee3a5;background:#109675;color:#fff;padding:15px;border-radius:12px;font-weight:900;cursor:pointer;font-size:15px}.btn:disabled{opacity:.55}.status{margin:16px 0;color:#ffc857}.back{display:inline-block;margin-top:20px;color:#45c8ff;text-decoration:none}</style></head><body><main class="card"><div class="logo">SIGNAL <b>PRO</b></div><h2>Conectar Avalon</h2><p class="muted">Autorize sua conta pela conexão oficial da Avalon. O Signal Pro não solicita sua senha.</p><button id="connect" class="btn" disabled>CONECTAR CONTA AVALON</button><div id="status" class="status">Preparando conexão...</div><a class="back" href="/app.html">← Voltar aos sinais</a></main><script type="module">const b=document.getElementById('connect'),s=document.getElementById('status');try{const r=await fetch('/api/avalon-config');const cfg=await r.json();if(!r.ok)throw new Error('Configuração indisponível');if(cfg.ready){s.textContent='Pronto para conectar.';b.disabled=false;b.onclick=()=>{sessionStorage.setItem('avalon_config',JSON.stringify(cfg));location.href='/avalon/start'}}else{s.textContent='Conexão Avalon ainda não configurada.'}}catch(e){s.textContent='Não foi possível preparar a conexão Avalon.'}</script></body></html>
