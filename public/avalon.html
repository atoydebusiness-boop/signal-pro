<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Avalon</title><style>body{margin:0;background:#08111e;color:#edf5ff;font:15px system-ui;min-height:100vh;display:grid;place-items:center}.card{width:min(620px,calc(100% - 32px));background:#0d1725;border:1px solid #20334d;border-radius:20px;padding:28px}.logo{text-align:center;font-size:27px;font-weight:900}.logo b{color:#4bc9ff}.row{background:#091421;border:1px solid #1c3049;border-radius:12px;padding:12px;margin:10px 0}.row small{display:block;color:#8294ab}.btn{width:100%;border:1px solid #2ee3a5;background:linear-gradient(135deg,#138967,#16a477);color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.status{text-align:center;color:#ffc857;margin:15px}a{color:#4bc9ff}</style></head><body><div class="card"><div class="logo">SIGNAL <b>PRO</b> × AVALON</div><h2>Integração oficial</h2><div class="row"><small>API / OAuth</small><b id="api">Carregando...</b></div><div class="row"><small>WebSocket</small><b id="ws">Carregando...</b></div><div class="row"><small>Permissão</small><b id="scope">full offline_access</b></div><div id="status" class="status">Verificando credenciais...</div><button id="connect" class="btn" disabled>CONECTAR CONTA AVALON</button><p style="text-align:center"><a href="/app.html">← Voltar ao Signal Pro</a></p></div><script type="module">const q=x=>document.getElementById(x);const cfg=await fetch('/api/avalon-config').then(r=>r.json());q('api').textContent=cfg.apiBaseUrl;q('ws').textContent=cfg.wsUrl;q('scope').textContent=cfg.scope;if(!cfg.ready){q('status').textContent='Estrutura pronta. Aguardando Client ID da Avalon.'}else{q('status').textContent='Credencial detectada. Pronto para autorização OAuth/PKCE.';q('connect').disabled=false}q('connect').onclick=()=>{sessionStorage.setItem('avalon_config',JSON.stringify(cfg));location.href='/avalon/start'};</script></body></html>
