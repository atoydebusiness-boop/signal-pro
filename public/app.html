<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Área de Sinais</title><style>:root{--bg:#060b13;--p:#0d1725;--ln:#20334d;--tx:#edf5ff;--mu:#8294ab;--g:#27e39a;--r:#ff6075;--y:#ffc857;--c:#4bc9ff}*{box-sizing:border-box}body{margin:0;background:#08111e;color:var(--tx);font:14px system-ui;min-height:100vh}.gate{min-height:100vh;display:grid;place-items:center}.w{max-width:900px;margin:auto;padding:20px;display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:24px;font-weight:900}.logo b{color:var(--c)}button,.badge{border:1px solid #29415f;background:#102137;color:white;padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.badge{color:var(--g)}.warning{margin:17px 0;padding:13px 16px;border:1px solid #6b5421;background:#251e0d;border-radius:14px;color:#ffd978}.card{background:#0d1725;border:1px solid var(--ln);border-radius:20px;padding:24px}.title{text-align:center;color:var(--mu);font-weight:800}.tf{text-align:center;margin:16px}.tf select{background:#09121f;color:#fff;border:1px solid #29415f;border-radius:10px;padding:11px}.pair{text-align:center;font-size:34px;font-weight:950;margin-top:15px}.hero{text-align:center;padding:18px}.arr{font-size:62px;font-weight:900}.hero h1{font-size:48px;margin:4px}.buy h1,.buy .arr,.up{color:var(--g)}.sell h1,.sell .arr,.down{color:var(--r)}.wait h1,.wait .arr,.flat{color:var(--y)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.st{background:#091421;border:1px solid #1c3049;border-radius:12px;padding:13px}.st small{display:block;color:var(--mu)}.inds{margin-top:18px}.ind{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #17263b}.searching{text-align:center;padding:45px}.foot{text-align:center;color:#71839a;font-size:12px;margin:15px}@media(max-width:650px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="gate" class="gate">Verificando seu acesso...</div><div id="app" class="w"><div class="top"><div class="logo">SIGNAL <b>PRO</b></div><div><span id="conn" class="badge">● CONECTANDO</span> <button id="logout">SAIR</button></div></div><div class="warning"><b>Mercado aberto / Forex real.</b> Não utilize em ativos OTC.</div><section class="card"><div class="title">⭐ MELHOR SINAL AGORA</div><div class="tf"><select id="interval"><option value="1min">PRÓXIMA VELA • M1</option><option value="5min">PRÓXIMA VELA • M5</option></select></div><div id="content" class="searching"><h2>ANALISANDO O MERCADO...</h2></div></section><div class="foot">Nova análise em <b id="count">—</b> • Análise técnica não garante resultado.</div></div><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/auth-config').then(r=>r.json()),sb=createClient(cfg.url,cfg.key);const{data:{session}}=await sb.auth.getSession();if(!session){location.replace('/login.html')}else{const{data:p}=await sb.from('profiles').select('status').eq('id',session.user.id).single();if(p&&p.status==='blocked'){await sb.auth.signOut();location.replace('/login.html')}else{gate.style.display='none';app.style.display='block';start()}}logout.onclick=async()=>{await sb.auth.signOut();location.replace('/login.html')};function start(){const syms=['EUR/USD','GBP/USD','USD/JPY','AUD/USD','EUR/JPY','GBP/JPY'];let raw={},cache={},secs=1;const $=x=>document.getElementById(x);function sma(a,n){let x=a.slice(-n);return x.reduce((s,v)=>s+v,0)/x.length}function ema(a,n){let k=2/(n+1),e=a[0];for(let i=1;i<a.length;i++)e=a[i]*k+e*(1-k);return e}function rsi(a,n=14){let g=0,l=0;for(let i=a.length-n;i<a.length;i++){let d=a[i]-a[i-1];d>0?g+=d:l-=d}return l?100-100/(1+(g/n)/(l/n)):100}function atr(c,n=14){let x=[];for(let i=1;i<c.length;i++)x.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));return sma(x,n)}function agg5(c){let o=[];for(let i=0;i+4<c.length;i+=5){let x=c.slice(i,i+5);o.push({o:x[0].o,h:Math.max(...x.map(z=>z.h)),l:Math.min(...x.map(z=>z.l)),c:x[4].c})}return o}function analyze(c){let cl=c.map(x=>x.c),last=cl.at(-1),e9=ema(cl,9),e21=ema(cl,21),R=rsi(cl),A=atr(c),mom=last-cl.at(-4),v=[['EMA 9/21',e9>e21?1:-1],['RSI 14',R<35?1:R>65?-1:0],['Momentum',mom>0?1:mom<0?-1:0],['Última vela',c.at(-1).c>c.at(-1).o?1:-1]],rs=v.reduce((s,z)=>s+z[1],0),dir=Math.sign(rs),agree=v.filter(z=>Math.sign(z[1])===dir).length,sc=Math.round(agree/v.length*100),sep=A?Math.abs(e9-e21)/A:0,type=agree>=3&&sep>.04?(dir>0?'buy':'sell'):'wait';return{v,agree,sc,type,last,e9,e21,R,rank:sc+Math.min(sep,.5)*30+(type==='wait'?-50:0)}}function norm(data,s){let d=data[s];if(!d?.values)throw Error();return d.values.map(x=>({o:+x.open,h:+x.high,l:+x.low,c:+x.close}))}function build(){cache={};for(const s of syms){let c=interval.value==='5min'?agg5(raw[s]):raw[s];if(c?.length>25)cache[s]=analyze(c)}}function render(){let b=Object.entries(cache).filter(([,a])=>a.type!=='wait').sort((a,b)=>b[1].rank-a[1].rank)[0];if(!b){content.innerHTML='<div class="hero wait"><div class="arr">•</div><h1>AGUARDAR</h1><b>NENHUMA ENTRADA BOA AGORA</b></div>';return}let[s,a]=b,action=a.type==='buy'?'COMPRA':'VENDA';content.innerHTML=`<div class="pair">${s}</div><div class="hero ${a.type}"><div class="arr">${a.type==='buy'?'↑':'↓'}</div><h1>${action}</h1><b>Confluência ${a.agree}/${a.v.length} • ${a.sc}%</b><p>Entrada: abertura da próxima vela ${interval.value==='1min'?'M1':'M5'}</p></div><div class="stats"><div class="st"><small>PREÇO</small><b>${a.last.toFixed(s.includes('JPY')?3:5)}</b></div><div class="st"><small>TENDÊNCIA</small><b>${a.e9>a.e21?'ALTA':'BAIXA'}</b></div><div class="st"><small>RSI</small><b>${a.R.toFixed(1)}</b></div></div><div class="inds">${a.v.map(z=>`<div class="ind"><span>${z[0]}</span><b class="${z[1]>0?'up':z[1]<0?'down':'flat'}">${z[1]>0?'COMPRA':z[1]<0?'VENDA':'NEUTRO'}</b></div>`).join('')}</div>`}async function update(){try{let r=await fetch('/api/market',{headers:{Authorization:'Bearer '+session.access_token}}),j=await r.json();if(!r.ok)throw Error();for(const s of syms)raw[s]=norm(j.data,s);build();render();conn.textContent='● MERCADO REAL CONECTADO'}catch(e){conn.textContent='● FONTE INDISPONÍVEL'}secs=62}interval.onchange=()=>{build();render()};update();setInterval(()=>{secs--;count.textContent=Math.max(0,secs)+'s';if(secs<=0)update()},1000)}};</script></body></html>
