<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Signal Pro — Robô</title><style>:root{--bg:#07111f;--side:#091524;--card:#0d1b2c;--line:#1d3450;--tx:#f3f7ff;--mu:#7890ad;--blue:#3c8dff;--green:#20d889;--red:#ff5570;--cyan:#4bc9ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px system-ui,Segoe UI}.shell{height:100%;display:grid;grid-template-columns:72px 1fr}.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:17px 10px;gap:13px}.brand{font-size:23px;font-weight:950;color:var(--cyan);margin-bottom:16px}.nav{width:46px;height:46px;border:0;border-radius:13px;background:transparent;color:#8ca1bb;font-size:20px;cursor:pointer}.nav:hover,.nav.on{background:#112b50;color:#52a2ff}.main{min-width:0;display:flex;flex-direction:column;height:100%}.head{padding:18px 24px 12px;display:flex;justify-content:space-between;align-items:center;gap:15px}.head h1{margin:0;font-size:23px}.sub{color:#7fa3ca;margin-top:3px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.pill,.btn{border:1px solid #294666;background:#102139;color:#eaf3ff;border-radius:10px;padding:9px 12px;font-weight:800;text-decoration:none}.pill.online{color:var(--green)}.btn.avalon{background:linear-gradient(135deg,#0d5d58,#12816e);border-color:#23d69a}.btn.pro{background:#6d5315;border-color:#b78c27}.status{margin:0 24px 12px;padding:12px 15px;background:#091729;border:1px solid var(--line);border-radius:13px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:9px 12px;border-right:1px solid #1a3049}.stat:last-child{border:0}.stat small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}.stat b{display:block;margin-top:5px}.green{color:var(--green)}.view{flex:1;min-height:0;padding:0 24px 20px}.frame{height:100%;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#081421}.frame iframe{width:100%;height:100%;border:0;display:block}.panel{height:100%;overflow:auto;padding:28px}.panel h2{font-size:25px;margin:0 0 6px}.panel .lead{color:#8ba0ba;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#0d1b2c;border:1px solid var(--line);border-radius:16px;padding:20px}.card small{color:var(--mu);text-transform:uppercase}.card strong{display:block;font-size:22px;margin-top:7px}.card p{color:#9cb0c8;line-height:1.5}.bigbtn{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:11px;background:#148c70;border:1px solid #27dda5;color:white;text-decoration:none;font-weight:900}.mobilebar{display:none}.mobilebar button{cursor:pointer}.mobilebar button.on{color:#4da0ff}.only-mobile{display:none}@media(max-width:760px){html,body{height:auto;min-height:100%}.shell{display:block;min-height:100vh}.side{display:none}.main{height:auto;min-height:100vh}.head{padding:16px 16px 12px;align-items:flex-start;flex-direction:column}.head h1{font-size:25px}.sub{font-size:14px}.actions{width:100%}.actions .pill,.actions .btn{flex:1;text-align:center;white-space:nowrap}.status{margin:0 16px 12px;grid-template-columns:1fr 1fr;padding:10px}.stat{border:0;padding:9px 8px}.view{height:calc(100vh - 345px);min-height:480px;padding:0 12px 76px}.frame{height:100%;border-radius:15px}.panel{padding:18px 15px}.grid{grid-template-columns:1fr}.mobilebar{position:fixed;display:flex;z-index:20;bottom:0;left:0;right:0;height:64px;background:#091524;border-top:1px solid var(--line);justify-content:space-around;align-items:center}.mobilebar button{background:none;border:0;color:#9cb0c9;font-size:21px;width:25%;height:100%}.only-mobile{display:block}}@media(max-width:430px){.status{grid-template-columns:1fr 1fr}.actions .btn.pro{flex-basis:100%}.view{height:calc(100vh - 380px);min-height:440px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">SP</div><button class="nav on" data-view="home" title="Painel">⌂</button><button class="nav" data-view="signals" title="Sinais">☷</button><button class="nav" data-view="management" title="Gerenciamento">◉</button><button class="nav" data-view="avalon" title="Avalon">⚡</button><button class="nav" data-view="settings" title="Configurações">⚙</button><div style="flex:1"></div><a class="nav" href="/" title="Sair da área" style="text-decoration:none;text-align:center;padding-top:10px">↩</a></aside><main class="main"><header class="head"><div><h1>Signal Pro <span style="color:var(--cyan)">Robot</span></h1><div class="sub">Sinais, gerenciamento e conexão da corretora em um só painel.</div></div><div class="actions"><span class="pill online">● FOREX ONLINE</span><button class="btn avalon" data-view="avalon">⚡ CONECTAR AVALON</button><a class="btn pro" href="/assinar.html" target="_top">PRO • R$ 59,90</a></div></header><section class="status"><div class="stat"><small>Robô</small><b>● MONITORANDO SINAIS</b></div><div class="stat"><small>Fonte de mercado</small><b class="green">FOREX ATIVA</b></div><div class="stat"><small>Corretora</small><b id="brokerState">AVALON • DESCONECTADA</b></div><div class="stat"><small>Execução</small><b>MANUAL • PROTEGIDA</b></div></section><div class="view"><div class="frame" id="frame"><iframe id="workspace" src="/scanner.html" title="Signal Pro"></iframe></div></div></main></div><div class="mobilebar"><button class="on" data-view="home" title="Painel">⌂</button><button data-view="signals" title="Sinais">☷</button><button data-view="management" title="Gerenciamento">◉</button><button data-view="avalon" title="Avalon">⚡</button><button data-view="settings" title="Configurações">⚙</button></div><script>const frame=document.getElementById('frame'),broker=document.getElementById('brokerState');function scanner(){frame.innerHTML='<iframe id="workspace" src="/scanner.html" title="Signal Pro"></iframe>'}function panel(title,lead,html){frame.innerHTML=`<div class="panel"><h2>${title}</h2><div class="lead">${lead}</div>${html}</div>`}function openView(v){document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('on',x.dataset.view===v));if(v==='home'||v==='signals'){scanner();return}if(v==='management'){panel('Gerenciamento','Controle sua sessão e o risco antes de operar.',`<div class="grid"><div class="card"><small>Banca e entrada</small><strong>Dentro da área de sinais</strong><p>Banca inicial, banca atual e valor padrão da entrada ficam sincronizados com seu histórico.</p><button class="bigbtn" onclick="openView('signals')">ABRIR GERENCIAMENTO</button></div><div class="card"><small>Meta</small><strong>Meta de lucro</strong><p>Defina no scanner o valor de resultado que encerra sua sessão.</p></div><div class="card"><small>Proteção</small><strong>Limite de perda</strong><p>Use um limite de perda para evitar continuar uma sessão além do planejado.</p></div></div>`);return}if(v==='avalon'){panel('Conectar Avalon','Conexão oficial da sua conta. Os detalhes técnicos ficam ocultos.',`<div class="card" style="max-width:620px"><small>Corretora</small><strong>Avalon</strong><p>Autorize o Signal Pro usando o login oficial da corretora. Sua senha não é armazenada pelo Signal Pro.</p><a class="bigbtn" href="/avalon/start.html" target="_top">⚡ CONECTAR CONTA AVALON</a></div>`);return}if(v==='settings'){panel('Configurações','Preferências da área de membros.',`<div class="grid"><div class="card"><small>Timeframe</small><strong>M1 / M5</strong><p>A seleção do período é feita diretamente na tela de sinais.</p><button class="bigbtn" onclick="openView('signals')">IR PARA SINAIS</button></div><div class="card"><small>Fonte</small><strong>Forex</strong><p>Permanece como fonte de mercado enquanto a Avalon estiver desconectada.</p></div><div class="card"><small>Segurança</small><strong>Execução manual</strong><p>O Signal Pro gera e acompanha sinais; nenhuma entrada é executada automaticamente.</p></div></div>`);}}document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();openView(b.dataset.view)}));if(sessionStorage.getItem('avalon_connected')==='1'){broker.textContent='AVALON • CONECTADA';broker.classList.add('green')}window.openView=openView;</script></body></html>
