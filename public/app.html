<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Pro — Painel</title>
<style>
:root{--bg:#07111f;--panel:#0b192a;--line:#1d3854;--text:#edf7ff;--muted:#8fa5bd;--cyan:#42c8ff;--green:#2ee3a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#123453 0,transparent 42%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,a{font:inherit}.shell{display:flex;min-height:100vh}.side{width:224px;background:rgba(7,17,31,.94);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:7px;flex-shrink:0}.brand{font-weight:950;font-size:20px;letter-spacing:.08em;padding:4px 12px 22px}.brand span{color:var(--cyan)}.nav{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;border-radius:11px;padding:12px 13px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;transition:.18s}.nav:hover{background:#10263c;color:var(--text)}.nav.on{background:linear-gradient(90deg,#123a56,#10263c);border-color:#23597a;color:var(--text);box-shadow:inset 3px 0 var(--cyan)}.nav .ico{width:22px;text-align:center;color:var(--cyan);font-weight:800}.side-spacer{flex:1}.exit{color:#a6b8cc;text-decoration:none}.main{min-width:0;flex:1;padding:26px clamp(16px,3vw,38px)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.head h1{font-size:25px;margin:0 0 5px}.head h1 span{color:var(--cyan)}.sub{color:var(--muted)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill,.btn{border-radius:9px;padding:10px 13px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.02em}.pill{color:var(--green);background:#092b2a}.btn{background:#10263c;cursor:pointer}.btn:hover{border-color:var(--cyan)}.btn.avalon{background:#08765f;border-color:var(--green)}.btn.pro{background:#243259;border-color:#5667a5}.status{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(11,25,42,.84);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.stat{padding:14px 16px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.stat b{font-size:12px}.green{color:var(--green)}.view{min-height:calc(100vh - 207px)}.frame{min-height:calc(100vh - 207px);background:rgba(7,17,31,.65);border:1px solid var(--line);border-radius:15px;overflow:hidden}.workspace{display:block;width:100%;height:calc(100vh - 207px);min-height:580px;border:0}.panel{padding:clamp(20px,4vw,42px);max-width:1040px}.panel h2{font-size:25px;margin:0 0 8px}.lead{color:var(--muted);margin-bottom:24px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#10263c,#0b192a);border:1px solid var(--line);border-radius:14px;padding:20px}.card small{display:block;color:var(--cyan);text-transform:uppercase;font-size:10px;letter-spacing:.08em;margin-bottom:12px}.card strong{display:block;font-size:17px;margin-bottom:9px}.card p{color:var(--muted);line-height:1.5;margin:0 0 18px}.bigbtn{display:inline-block;background:#08765f;border:1px solid var(--green);color:#fff;border-radius:9px;padding:11px 14px;text-decoration:none;font-weight:800;cursor:pointer}.mobilebar{display:none}
@media(max-width:800px){.side{display:none}.main{padding:17px 13px 80px}.head{display:block}.head h1{font-size:22px}.actions{justify-content:flex-start;margin-top:15px}.status{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.view,.frame{min-height:calc(100vh - 280px)}.workspace{height:calc(100vh - 280px);min-height:520px}.grid{grid-template-columns:1fr}.mobilebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:66px;display:flex;justify-content:space-around;align-items:stretch;background:#091524;border-top:1px solid var(--line)}.mobilebar .nav{justify-content:center;flex-direction:column;gap:2px;border-radius:0;text-align:center;padding:7px 3px;font-size:10px}.mobilebar .nav .ico{font-size:18px}.mobilebar .nav.on{box-shadow:inset 0 3px var(--cyan)}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">SIGNAL <span>PRO</span></div><nav id="desktopNav"></nav><div class="side-spacer"></div><a class="nav exit" href="/"><span class="ico">↩</span><span>Sair da área</span></a></aside>
<main class="main"><header class="head"><div><h1>Signal Pro <span>Robot</span></h1><div class="sub">Sinais, gerenciamento e conexão da corretora em um só painel.</div></div><div class="actions"><span class="pill">● FOREX ONLINE</span><button class="btn avalon" data-view="avalon">⚡ CONECTAR AVALON</button><a class="btn pro" href="/assinar.html">PRO • R$ 59,90</a></div></header>
<section class="status"><div class="stat"><small>Robô</small><b>● MONITORANDO SINAIS</b></div><div class="stat"><small>Fonte de mercado</small><b class="green">FOREX ATIVA</b></div><div class="stat"><small>Corretora</small><b id="brokerState">AVALON • DESCONECTADA</b></div><div class="stat"><small>Execução</small><b>MANUAL • PROTEGIDA</b></div></section>
<section class="view"><div class="frame" id="frame"></div></section></main></div><nav class="mobilebar" id="mobileNav"></nav>
<script>
const items=[['home','⌂','Painel'],['signals','☷','Sinais'],['management','◉','Gerenciamento'],['avalon','⚡','Avalon'],['settings','⚙','Configurações']];const frame=document.getElementById('frame'),broker=document.getElementById('brokerState');
function navMarkup(){return items.map(([id,ico,label])=>`<button class="nav" data-view="${id}"><span class="ico">${ico}</span><span>${label}</span></button>`).join('')}desktopNav.innerHTML=navMarkup();mobileNav.innerHTML=navMarkup();
function scanner(){frame.innerHTML='<iframe class="workspace" src="/scanner.html" title="Sinais do Signal Pro"></iframe>'}function panel(title,lead,html){frame.innerHTML=`<div class="panel"><h2>${title}</h2><div class="lead">${lead}</div>${html}</div>`}
function openView(view){document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('on',el.dataset.view===view));history.replaceState(null,'',view==='home'?'/app.html':'/app.html#'+view);if(view==='home'||view==='signals'){scanner();return}if(view==='management'){panel('Gerenciamento','Defina sua banca, entrada e limites antes de acompanhar os sinais.',`<div class="grid"><div class="card"><small>Controle de risco</small><strong>Banca e entrada</strong><p>Esses valores ficam disponíveis na tela de sinais para você operar com disciplina.</p><button class="bigbtn" data-open="signals">ABRIR SINAIS</button></div><div class="card"><small>Meta</small><strong>Meta de lucro</strong><p>Configure sua meta diretamente no painel de sinais.</p></div><div class="card"><small>Proteção</small><strong>Limite de perda</strong><p>Use um limite para encerrar a sessão no momento certo.</p></div></div>`);return}if(view==='avalon'){const connected=sessionStorage.getItem('avalon_connected')==='1';panel('Conectar Avalon','Faça a autorização oficial sem compartilhar sua senha com o Signal Pro.',`<div class="card" style="max-width:650px"><small>Status da corretora</small><strong>${connected?'Avalon conectada':'Avalon desconectada'}</strong><p>${connected?'Sua autorização foi concluída nesta sessão. Você pode voltar aos sinais.':'O fluxo usa OAuth/PKCE: a senha é digitada somente no ambiente oficial da Avalon.'}</p>${connected?'<button class="bigbtn" data-open="signals">VOLTAR AOS SINAIS</button>':'<a class="bigbtn" href="/avalon/start">⚡ CONECTAR CONTA AVALON</a>'}</div>`);return}panel('Configurações','Preferências rápidas do seu painel de análise.',`<div class="grid"><div class="card"><small>Timeframe</small><strong>M1 / M5</strong><p>Escolha o período diretamente na tela de sinais.</p><button class="bigbtn" data-open="signals">IR PARA SINAIS</button></div><div class="card"><small>Fonte</small><strong>Forex</strong><p>Dados de mercado em tempo real para análise técnica.</p></div><div class="card"><small>Segurança</small><strong>Execução manual</strong><p>O Signal Pro gera sinais; nenhuma entrada é executada automaticamente.</p></div></div>`)}
document.addEventListener('click',e=>{const target=e.target.closest('[data-view]');if(target)openView(target.dataset.view);const go=e.target.closest('[data-open]');if(go)openView(go.dataset.open)});if(sessionStorage.getItem('avalon_connected')==='1')broker.textContent='AVALON • CONECTADA';openView(location.hash.slice(1)||'home');
</script></body></html>
