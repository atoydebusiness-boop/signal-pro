<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal Pro — Painel</title>
<style>
:root{--bg:#07111f;--panel:#0b192a;--line:#1d3854;--text:#edf7ff;--muted:#8fa5bd;--cyan:#42c8ff;--green:#2ee3a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#123453 0,transparent 42%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,a{font:inherit}.shell{display:flex;min-height:100vh}.side{width:224px;background:rgba(7,17,31,.94);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:7px;flex-shrink:0}.brand{font-weight:950;font-size:20px;letter-spacing:.08em;padding:4px 12px 22px}.brand span{color:var(--cyan)}.nav{display:flex;align-items:center;gap:12px;width:100%;border:1px solid transparent;border-radius:11px;padding:12px 13px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;transition:.18s}.nav:hover{background:#10263c;color:var(--text)}.nav.on{background:linear-gradient(90deg,#123a56,#10263c);border-color:#23597a;color:var(--text);box-shadow:inset 3px 0 var(--cyan)}.nav .ico{width:22px;text-align:center;color:var(--cyan);font-weight:800}.side-spacer{flex:1}.exit{color:#a6b8cc;text-decoration:none}.main{min-width:0;flex:1;padding:26px clamp(16px,3vw,38px)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}.head h1{font-size:25px;margin:0 0 5px}.head h1 span{color:var(--cyan)}.sub{color:var(--muted)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill,.btn{border-radius:9px;padding:10px 13px;border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.02em}.pill{color:var(--green);background:#092b2a}.btn{background:#10263c;cursor:pointer}.btn:hover{border-color:var(--cyan)}.btn.avalon{background:#08765f;border-color:var(--green)}.btn.pro{background:#243259;border-color:#5667a5}.status{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(11,25,42,.84);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.stat{padding:14px 16px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.stat b{font-size:12px}.green{color:var(--green)}.view{min-height:calc(100vh - 207px)}.frame{min-height:calc(100vh - 207px);background:rgba(7,17,31,.65);border:1px solid var(--line);border-radius:15px;overflow:hidden}.workspace{display:block;width:100%;height:calc(100vh - 207px);min-height:580px;border:0}.panel{padding:clamp(20px,4vw,42px);max-width:1040px}.panel h2{font-size:25px;margin:0 0 8px}.lead{color:var(--muted);margin-bottom:24px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#10263c,#0b192a);border:1px solid var(--line);border-radius:14px;padding:20px}.card small{display:block;color:var(--cyan);text-transform:uppercase;font-size:10px;letter-spacing:.08em;margin-bottom:12px}.card strong{display:block;font-size:17px;margin-bottom:9px}.card p{color:var(--muted);line-height:1.5;margin:0 0 18px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.section-card{background:linear-gradient(145deg,#10263c,#0b192a);border:1px solid var(--line);border-radius:14px;padding:18px}.section-card h3{font-size:14px;color:var(--cyan);margin:0 0 15px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:11px;color:var(--muted)}.field input,.field select{width:100%;padding:10px;border:1px solid #294966;border-radius:8px;background:#071522;color:var(--text);outline:none}.field input:focus,.field select:focus{border-color:var(--cyan)}.switch{display:flex;align-items:center;gap:8px;color:var(--text);font-size:12px;margin:10px 0}.switch input{accent-color:var(--green);width:16px;height:16px}.savebar{display:flex;align-items:center;gap:12px;margin-top:17px}.savebar small{color:var(--muted)}.danger{color:#ff8795!important}.guard{grid-column:1/-1;border-color:#2c5871}.guard strong{font-size:15px}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}@media(max-width:800px){.settings-grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.guard{grid-column:auto}}.bigbtn{display:inline-block;background:#08765f;border:1px solid var(--green);color:#fff;border-radius:9px;padding:11px 14px;text-decoration:none;font-weight:800;cursor:pointer}.mobilebar{display:none}
@media(max-width:800px){.side{display:none}.main{padding:17px 13px 80px}.head{display:block}.head h1{font-size:22px}.actions{justify-content:flex-start;margin-top:15px}.status{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.view,.frame{min-height:calc(100vh - 280px)}.workspace{height:calc(100vh - 280px);min-height:520px}.grid{grid-template-columns:1fr}.mobilebar{position:fixed;z-index:5;bottom:0;left:0;right:0;height:66px;display:flex;justify-content:space-around;align-items:stretch;background:#091524;border-top:1px solid var(--line)}.mobilebar .nav{justify-content:center;flex-direction:column;gap:2px;border-radius:0;text-align:center;padding:7px 3px;font-size:10px}.mobilebar .nav .ico{font-size:18px}.mobilebar .nav.on{box-shadow:inset 0 3px var(--cyan)}}
</style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">SIGNAL <span>PRO</span></div><nav id="desktopNav"></nav><div class="side-spacer"></div><a class="nav exit" href="/"><span class="ico">↩</span><span>Sair da área</span></a></aside>
<main class="main"><header class="head"><div><h1>Signal Pro <span>Robot</span></h1><div class="sub">Sinais, gerenciamento e conexão da corretora em um só painel.</div></div><div class="actions"><span class="pill">● FOREX ONLINE</span><button class="btn avalon" data-view="avalon">⚡ CONECTAR AVALON</button><a class="btn pro" href="/assinar.html">PRO • R$ 59,90</a></div></header>
<section class="status"><div class="stat"><small>Robô</small><b>● MONITORANDO SINAIS</b></div><div class="stat"><small>Fonte de mercado</small><b class="green">FOREX ATIVA</b></div><div class="stat"><small>Corretora</small><b id="brokerState">AVALON • DESCONECTADA</b></div><div class="stat"><small>Execução</small><b>MANUAL • PROTEGIDA</b></div></section>
<section class="view"><div class="frame" id="frame"></div></section></main></div><nav class="mobilebar" id="mobileNav"></nav>
<script>
const items=[['home','⌂','Painel'],['signals','☷','Sinais'],['management','◉','Gerenciamento'],['avalon','⚡','Avalon'],['settings','⚙','Configurações']];const frame=document.getElementById('frame'),broker=document.getElementById('brokerState');
function navMarkup(){return items.map(([id,ico,label])=>`<button class="nav" data-view="${id}"><span class="ico">${ico}</span><span>${label}</span></button>`).join('')}desktopNav.innerHTML=navMarkup();mobileNav.innerHTML=navMarkup();
function scanner(){frame.innerHTML='<iframe class="workspace" src="/scanner.html" title="Sinais do Signal Pro"></iframe>'}function panel(title,lead,html){frame.innerHTML=`<div class="panel"><h2>${title}</h2><div class="lead">${lead}</div>${html}</div>`}
function openView(view){document.querySelectorAll('[data-view]').forEach(el=>el.classList.toggle('on',el.dataset.view===view));history.replaceState(null,'',view==='home'?'/app.html':'/app.html#'+view);if(view==='home'||view==='signals'){scanner();return}if(view==='management'){panel('Gerenciamento','Controle a banca e os limites do robô em um só lugar.',`<div class="settings-grid"><div class="section-card"><h3>Controle da sessão</h3><div class="fields"><div class="field"><label>Banca inicial</label><input data-setting="bankroll" type="number" min="0" step="0.01" placeholder="1000"></div><div class="field"><label>Valor da entrada</label><input data-setting="stake" type="number" min="0" step="0.01" placeholder="10"></div><div class="field"><label>Máximo de operações</label><input data-setting="maxTrades" type="number" min="1" step="1" placeholder="10"></div><div class="field"><label>Perdas consecutivas</label><input data-setting="maxLosses" type="number" min="1" step="1" placeholder="3"></div></div></div><div class="section-card"><h3>Stop WIN e STOP LOSS</h3><div class="fields"><div class="field"><label>Modo</label><select data-setting="stopMode"><option value="value">Valor em R$</option><option value="percent">Percentual</option></select></div><div class="field"><label>Stop WIN</label><input data-setting="stopWin" type="number" min="0" step="0.01" placeholder="100"></div><div class="field"><label>Stop LOSS</label><input data-setting="stopLoss" type="number" min="0" step="0.01" placeholder="50"></div><div class="field"><label>Pausa após loss (min)</label><input data-setting="cooldown" type="number" min="0" step="1" placeholder="5"></div></div></div><div class="section-card guard"><h3>Guardião da sessão</h3><strong><span class="status-dot"></span>Proteção ativa por padrão</strong><p>Quando um limite for atingido, o robô pausa novas entradas e exige uma ação manual para continuar.</p><label class="switch"><input data-setting="demoMode" type="checkbox" checked> Começar em modo simulação</label></div></div><div class="savebar"><button class="bigbtn" data-save-settings> SALVAR GERENCIAMENTO </button><small data-save-message>As alterações ficam salvas neste navegador.</small></div>`);loadSettings();return}if(view==='avalon'){const connected=sessionStorage.getItem('avalon_connected')==='1';panel('Conectar Avalon','Faça a autorização oficial sem compartilhar sua senha com o Signal Pro.',`<div class="card" style="max-width:650px"><small>Status da corretora</small><strong>${connected?'Avalon conectada':'Avalon desconectada'}</strong><p>${connected?'Sua autorização foi concluída nesta sessão. Você pode voltar aos sinais.':'O fluxo usa OAuth/PKCE: a senha é digitada somente no ambiente oficial da Avalon.'}</p>${connected?'<button class="bigbtn" data-open="signals">VOLTAR AOS SINAIS</button>':'<a class="bigbtn" href="/avalon/start">⚡ CONECTAR CONTA AVALON</a>'}</div>`);return}panel('Configurações','Defina como o robô deve analisar o mercado e operar a sessão.',`<div class="settings-grid"><div class="section-card"><h3>Geral</h3><div class="fields"><div class="field"><label>Timeframe</label><select data-setting="timeframe"><option>M1</option><option>M5</option></select></div><div class="field"><label>Fonte</label><select data-setting="source"><option>Forex</option><option>Forex + OTC</option></select></div><div class="field"><label>Força mínima</label><select data-setting="strength"><option value="3">3 de 4 confirmações</option><option value="4">4 de 4 confirmações</option></select></div><div class="field"><label>Modo do robô</label><select data-setting="robotMode"><option value="simulation">Simulação</option><option value="manual">Sinal manual</option></select></div></div></div><div class="section-card"><h3>Filtros de proteção</h3><label class="switch"><input data-setting="trendFilter" type="checkbox" checked> Confirmar tendência</label><label class="switch"><input data-setting="candleFilter" type="checkbox" checked> Confirmar vela de entrada</label><label class="switch"><input data-setting="newsFilter" type="checkbox"> Pausar em notícias</label><label class="switch"><input data-setting="payoutFilter" type="checkbox" checked> Exigir payout mínimo</label></div><div class="section-card guard"><h3>Conexão e segurança</h3><strong>Avalon <span class="status-dot"></span><span id="settingsAvalon">verificando</span></strong><p>O robô deve ser testado em simulação antes de qualquer execução real. A conexão usa autorização oficial e não armazena sua senha.</p><button class="bigbtn" data-view="avalon">GERENCIAR CONEXÃO AVALON</button></div></div><div class="savebar"><button class="bigbtn" data-save-settings>SALVAR CONFIGURAÇÕES</button><small data-save-message>Configurações salvas apenas neste navegador.</small></div>`);loadSettings();return}
function loadSettings(){const data=JSON.parse(localStorage.getItem('signalProSettings')||'{}');document.querySelectorAll('[data-setting]').forEach(el=>{if(data[el.dataset.setting]!==undefined){if(el.type==='checkbox')el.checked=!!data[el.dataset.setting];else el.value=data[el.dataset.setting]}});const s=document.getElementById('settingsAvalon');if(s)s.textContent=sessionStorage.getItem('avalon_connected')==='1'?'conectada':'desconectada'}function saveSettings(){const data={};document.querySelectorAll('[data-setting]').forEach(el=>data[el.dataset.setting]=el.type==='checkbox'?el.checked:el.value);localStorage.setItem('signalProSettings',JSON.stringify(data));const m=document.querySelector('[data-save-message]');if(m)m.textContent='Salvo com segurança neste navegador.'}document.addEventListener('click',e=>{const target=e.target.closest('[data-view]');if(target)openView(target.dataset.view);const go=e.target.closest('[data-open]');if(go)openView(go.dataset.open);if(e.target.closest('[data-save-settings]'))saveSettings()});if(sessionStorage.getItem('avalon_connected')==='1')broker.textContent='AVALON • CONECTADA';openView(location.hash.slice(1)||'home');
</script></body></html>
