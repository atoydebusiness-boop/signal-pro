<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111e;color:#edf5ff;font:15px system-ui}.card{width:min(420px,92vw);padding:28px;background:#0d1725;border:1px solid #20334d;border-radius:20px}.logo{text-align:center;font-size:26px;font-weight:900;margin-bottom:22px}.logo b{color:#4bc9ff}.tabs{display:flex;gap:8px;margin-bottom:16px}button,input{width:100%;padding:13px;border-radius:11px;margin:6px 0;font:inherit}button{cursor:pointer;background:#11233a;border:1px solid #29415f;color:#fff;font-weight:800}.tabs .on{border-color:#4bc9ff;color:#4bc9ff}input{background:#09121f;border:1px solid #29415f;color:#fff}.primary{background:#147a60;border-color:#27e39a}.msg{text-align:center;color:#ffc857;min-height:22px;margin-top:10px}.small{text-align:center;color:#8294ab;font-size:12px;margin-top:12px}</style></head><body><main class="card"><div class="logo">SIGNAL <b>PRO</b></div><div class="tabs"><button id="in" class="on">ENTRAR</button><button id="up">CRIAR CONTA</button></div><form id="f"><input id="email" type="email" required placeholder="E-mail"><input id="pass" type="password" required minlength="6" placeholder="Senha"><button class="primary" id="go">ENTRAR</button></form><div id="msg" class="msg"></div><div class="small">Acesso protegido • Signal Pro</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/auth-config').then(r=>r.json()),sb=createClient(cfg.url,cfg.key);let mode='in';const q=x=>document.getElementById(x),a=q('in'),u=q('up'),g=q('go'),m=q('msg');function set(x){mode=x;a.className=x==='in'?'on':'';u.className=x==='up'?'on':'';g.textContent=x==='in'?'ENTRAR':'CRIAR CONTA';m.textContent=''}a.onclick=()=>set('in');u.onclick=()=>set('up');q('f').onsubmit=async e=>{e.preventDefault();g.disabled=true;m.textContent='Aguarde...';const credentials={email:q('email').value,password:q('pass').value};const r=mode==='in'?await sb.auth.signInWithPassword(credentials):await sb.auth.signUp(credentials);g.disabled=false;if(r.error){m.textContent=r.error.message;return}if(mode==='up'&&!r.data.session){m.textContent='Conta criada. Confirme seu e-mail para entrar.';return}location.href='/'};const{data}=await sb.auth.getSession();if(data.session)location.href='/';</script></body></html>
