<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg"><title>Signal Pro — Robô</title><style>:root{--bg:#07111f;--side:#091524;--card:#0d1b2c;--line:#1d3450;--tx:#f3f7ff;--mu:#7890ad;--green:#20d889}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px system-ui}.shell{height:100%;display:grid;grid-template-columns:72px 1fr}.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:17px 10px;gap:13px}.brand{font-size:23px;font-weight:950;color:#4bc9ff;margin-bottom:16px}.nav{width:46px;height:46px;border:0;border-radius:13px;background:transparent;color:#8ca1bb;font-size:20px;cursor:pointer}.nav:hover,.nav.on{background:#112b50;color:#52a2ff}.main{min-width:0;display:flex;flex-direction:column;height:100%}.head{padding:18px 24px 12px;display:flex;justify-content:space-between;align-items:center;gap:15px}.head h1{margin:0;font-size:23px}.sub{color:#7fa3ca;margin-top:3px}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.pill,.btn{border:1px solid #294666;background:#102139;color:#eaf3ff;border-radius:10px;padding:9px 12px;font-weight:800;text-decoration:none}.pill.online{color:var(--green)}.btn.avalon{background:linear-gradient(135deg,#0d5d58,#12816e);border-color:#23d69a}.btn.pro{background:#6d5315;border-color:#b78c27}.status{margin:0 24px 12px;padding:12px 15px;background:#091729;border:1px solid var(--line);border-radius:13px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:9px 12px;border-right:1px solid #1a3049}.stat:last-child{border:0}.stat small{display:block;color:var(--mu);font-size:11px;text-transform:uppercase}.stat b{display:block;margin-top:5px}.green{color:var(--green)}.view{flex:1;min-height:0;padding:0 24px 20px}.frame{height:100%;border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#081421}.frame iframe{width:100%;height:100%;border:0;display:block}.mobilebar{display:none}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.head{padding:14px;align-items:flex-start;flex-direction:column}.status{margin:0 14px 10px;grid-template-columns:1fr 1fr}.stat{border-right:0}.view{padding:0 14px 70px}.mobilebar{position:fixed;display:flex;z-index:5;bottom:0;left:0;right:0;height:58px;background:#091524;border-top:1px solid var(--line);justify-content:space-around;align-items:center}.mobilebar button{background:none;border:0;color:#9cb0c9;font-size:20px}}</style></head><body><div class="shell"><aside class="side"><div class="brand">SP</div><button class="nav on" data-target="scanner" data-anchor="top" title="Operações">⌂</button><button class="nav" data-target="scanner" data-anchor="signal" title="Sinais">☷</button><button class="nav" data-target="scanner" data-anchor="management" title="Gerenciamento">◉</button><button class="nav" data-target="avalon" title="Conectar Avalon">⚡</button><button class="nav" data-target="scanner" data-anchor="management" title="Configurações">⚙</button><div style="flex:1"></div><a class="nav" href="/" title="Início" style="text-decoration:none;text-align:center;padding-top:10px">↩</a></aside><main class="main"><header class="head"><div><h1>Signal Pro <span style="color:#4bc9ff">Robot</span></h1><div class="sub">Sinais, gerenciamento e conexão da corretora em um só painel.</div></div><div class="actions"><span class="pill online">● FOREX ONLINE</span><a class="btn avalon" href="/avalon">⚡ CONECTAR AVALON</a><a class="btn pro" href="/assinar">PRO • R$ 59,90</a></div></header><section class="status"><div class="stat"><small>Robô</small><b>● MONITORANDO SINAIS</b></div><div class="stat"><small>Fonte de mercado</small><b class="green">FOREX ATIVA</b></div><div class="stat"><small>Corretora</small><b>AVALON • DESCONECTADA</b></div><div class="stat"><small>Execução</small><b>MANUAL • PROTEGIDA</b></div></section><div class="view"><div class="frame"><iframe id="workspace" src="/scanner" title="Signal Pro"></iframe></div></div></main></div><div class="mobilebar"><button data-target="scanner">⌂</button><button data-target="scanner">☷</button><button data-target="avalon">⚡</button><button data-target="scanner">⚙</button></div><script>const f=document.getElementById('workspace');function go(b){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));if(b.classList.contains('nav'))b.classList.add('on');if(b.dataset.target==='avalon'){location.href='/avalon';return}f.src='/scanner';const a=b.dataset.anchor;if(a&&a!=='top')setTimeout(()=>{try{const d=f.contentDocument;if(a==='management'){const el=[...d.querySelectorAll('.card')].find(x=>x.textContent.includes('GERENCIAMENTO'));el?.scrollIntoView({behavior:'smooth'})}else if(a==='signal'){d.querySelector('.card')?.scrollIntoView({behavior:'smooth'})}}catch(e){}},500)}document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>go(b));</script></body></html>
