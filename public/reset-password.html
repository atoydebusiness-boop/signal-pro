<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Pro — Nova senha</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#edf7ff;font:15px system-ui}.card{width:min(430px,92vw);background:#0d1827;border:1px solid #28425f;border-radius:22px;padding:28px}.logo{text-align:center;font-size:25px;font-weight:900;margin-bottom:24px}.logo b{color:#42c8ff}input,button{width:100%;padding:13px;border-radius:11px;margin:6px 0;font:inherit}input{background:#081321;border:1px solid #29415f;color:#fff}button{background:#138967;border:1px solid #2ee3a5;color:#fff;font-weight:900;cursor:pointer}.msg{text-align:center;color:#ffc857;margin-top:12px;min-height:22px}p{color:#9db0c4}</style></head><body><main class="card"><div class="logo">SIGNAL <b>PRO</b></div><h2>Definir nova senha</h2><p>Escolha uma nova senha com pelo menos 6 caracteres.</p><form id="f"><input id="p1" type="password" minlength="6" required placeholder="Nova senha"><input id="p2" type="password" minlength="6" required placeholder="Confirmar nova senha"><button>ATUALIZAR SENHA</button></form><div id="msg" class="msg">Validando link...</div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const cfg=await fetch('/api/auth-config').then(r=>r.json()),sb=createClient(cfg.url,cfg.key),m=document.getElementById('msg');await new Promise(r=>setTimeout(r,500));const{data:{session}}=await sb.auth.getSession();m.textContent=session?'Link validado. Digite sua nova senha.':'Aguardando validação do link de recuperação.';document.getElementById('f').onsubmit=async e=>{e.preventDefault();const a=p1.value,b=p2.value;if(a!==b){m.textContent='As senhas não são iguais.';return}m.textContent='Atualizando...';const{error}=await sb.auth.updateUser({password:a});if(error){m.textContent=error.message;return}m.textContent='Senha atualizada. Redirecionando...';setTimeout(()=>location.href='/',1200)};</script></body></html>
