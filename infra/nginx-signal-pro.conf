# Add inside the existing http {} block.
upstream signal_pro_backend {
    server signal-pro-web:8780;
}

server {
    listen 80;
    server_name signalpro.ativasite.com.br;

    location /.well-known/acme-challenge/ {
        root /srv/acme-challenge;
        try_files $uri =404;
    }

    location / {
        return 301 https://signalpro.ativasite.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name signalpro.ativasite.com.br;

    ssl_certificate /etc/nginx/certs/signalpro-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/signalpro-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SignalProSSL:2m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://signal_pro_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
